name: EAS (build + OTA update)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [update, build, build-and-submit]
        default: update
  push:
    tags: ['v*']

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  eas:
    name: EAS ${{ inputs.action || 'build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip when EXPO_TOKEN is not configured
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::EXPO_TOKEN secret is not set; skipping EAS. See README > Releases."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXPO_TOKEN != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.EXPO_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: env.EXPO_TOKEN != ''
        run: pnpm install --frozen-lockfile
      # Tag pushes have no inputs, so they fall through to a build.
      - name: OTA update (production channel)
        if: env.EXPO_TOKEN != '' && inputs.action == 'update'
        run: eas update --branch production --auto --non-interactive
      - name: iOS build
        if: env.EXPO_TOKEN != '' && inputs.action != 'update'
        run: eas build --platform ios --profile production --non-interactive --no-wait
      - name: Submit to App Store Connect
        if: env.EXPO_TOKEN != '' && inputs.action == 'build-and-submit'
        run: eas submit --platform ios --profile production --latest --non-interactive --no-wait
