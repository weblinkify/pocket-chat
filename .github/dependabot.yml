version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
      testing:
        patterns: ['jest*', '@testing-library/*', 'msw']
      lint:
        patterns: ['eslint*', '@typescript-eslint/*', 'typescript-eslint', 'prettier']
    commit-message: { prefix: 'build(deps)' }

  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    groups:
      dev:
        dependency-type: development
    commit-message: { prefix: 'build(deps)' }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
    commit-message: { prefix: 'ci(deps)' }

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: 'build(deps)' }
