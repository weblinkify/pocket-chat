name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new chat
        2. Send "code"
        3. ...
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Mobile app, API, Shared contract, CI/CD, Docs]
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: iOS 18.2 simulator, iPhone 16, commit abc1234
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
